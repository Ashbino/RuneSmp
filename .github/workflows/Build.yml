name: Build plugin

on:
  push:
  pull_request:
  workflow_dispatch:   # lets you press "Run workflow" manually

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Find pom.xml and build
        run: |
          POM=$(find . -name pom.xml -not -path "*/target/*" | head -n 1)
          if [ -z "$POM" ]; then
            echo "No pom.xml found anywhere in the repo. Files in repo:"
            find . -not -path "./.git/*" | head -n 50
            exit 1
          fi
          echo "Building with $POM"
          mvn -B -f "$POM" package

      - name: Upload the plugin jar
        uses: actions/upload-artifact@v4
        with:
          name: Runes-plugin
          path: "**/target/Runes-*.jar"
          if-no-files-found: error
